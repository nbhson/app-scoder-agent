name: Release

# Publishes to npm with provenance when a version tag is pushed:
#   git tag v0.3.0 && git push origin v0.3.0
# Requires the NPM_TOKEN secret (an npm automation/granular access token)
# to be configured in the repository settings.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance (publishConfig.provenance)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # prepublishOnly (lint + typecheck + test) runs automatically on publish
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
