name: Release

# Manual publish workflow. Run from the Actions tab after tagging, or use it
# instead of a local `npm publish`. Requires the NPM_TOKEN secret.
# Provenance note: enabling publishConfig.provenance only works from CI (OIDC);
# remove this workflow and publish locally without it if provenance is not needed.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # required if provenance is enabled again
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # prepublishOnly (lint + typecheck + test) runs automatically on publish
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
