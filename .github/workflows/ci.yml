name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # eslint 10 requires Node ^20.19 || ^22.13 || >=24 (util.styleText)
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:layers
      - run: npm run build
      - run: npm test
      # Eval gate (Phase 3): deterministic mock-LLM scenarios. Any regression
      # fails the build — stricter than the plan's >5% threshold.
      - run: npm run eval
